version: '3.8'

services:
  webkrub-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: development
    ports:
      - "8082:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped
    stdin_open: true
    tty: true

networks:
  default:
    name: webkrub-dev-network
